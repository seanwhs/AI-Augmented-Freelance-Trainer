 Gap Finder (New)",tag:"Phase 1",body:"Here are 3 competitor trainer websites / LinkedIn bios in my niche: [Paste links or text]. Analyze what they all promise, what language they all use, and where they all sound identical. Then identify 3 positioning gaps they are ignoring that I could own, based on my background in [Insert your edge]."},{id:"p3",title:"Prompt 3: The Active-Learning Workshop Architect",tag:"Phase 2",body:"I am designing a [3-hour / full-day] interactive workshop on [Topic] for [Target Audience]. My proprietary framework has [3/4] steps: [Step 1], [Step 2], [Step 3]. Build a minute-by-minute facilitator agenda following a 20% concept / 60% hands-on practice / 20% debrief split. For every module, design a realistic, high-friction exercise or roleplay, no generic ‘turn to your neighbor and discuss’ prompts. Include exact facilitator debrief questions for each activity."},{id:"p4",title:"Prompt 4: The Industry-Specific Scenario Generator",tag:"Phase 2",body:"Write three realistic, high-stakes workplace scenarios for a training exercise on [Skill, e.g., pushing back on unrealistic stakeholder deadlines]. The participants are [Target Role] at a [Industry/Company Stage]. For each scenario, provide: Context: A 3-sentence background setup. The Trigger: The exact email or Slack message that sparks the conflict. Hidden Constraints: One political or operational constraint the participant must navigate without ruining the relationship."},{id:"p5",title:"Prompt 5: The Accordion Content Adapter",tag:"Phase 2",body:"Here is the full outline of my [4-hour] Signature Workshop: [Paste outline]. Condense this into a high-impact, 45-minute keynote or ‘lunch-and-learn’ talk. Keep only the single sharpest conceptual model and one 5-minute interactive audience exercise. Structure it with a gripping 2-minute opening hook and a natural closing transition that invites attendees to inquire about bringing the full workshop to their team."},{id:"p5b",title:"Prompt 5B: The Workbook & Takeaway Builder (New)",tag:"Phase 2",body:"Based on this workshop outline: [Paste outline], create a 1-page participant takeaway sheet. Include: 1) The framework visual described in words, 2) Three fill-in-the-blank scripts they can use on Monday, 3) A 7-day action checklist with one small behavior per day."},{id:"p6",title:"Prompt 6: The Content Waterfall Engine",tag:"Phase 3",body:"Below is a raw transcript of me talking for 5 minutes about [Topic] / an article I wrote: [Paste text]. Transform this single core insight into: 1. Two LinkedIn posts: One contrarian/myth-busting hook, and one tactical ‘how-to’ breakdown (under 220 words each, short paragraphs, zero corporate buzzwords). 2. One 60-second vertical video script: Structured as Hook (0-5s), Core Insight + Example (5-45s), Actionable Takeaway (45-60s). 3. One 3-sentence cold outreach angle I can send to [Target Buyer Title] referencing this exact insight."},{id:"p7",title:"Prompt 7: The Zero-Fluff “Lunch-and-Learn” Pitch",tag:"Phase 3",body:"Draft a cold outreach email (strictly under 120 words) to [Name], [Title] at [Company]. Context: I noticed [specific company trigger, e.g., they just closed a Series B / posted 5 roles for Team Leads / their CEO spoke on Podcast X about scaling culture]. Offer a complimentary, zero-pitch 30-minute interactive micro-workshop for their [Target Team] on solving [Specific Pain Point]. Keep the tone peer-to-peer, direct, and low-pressure, no exclamation points or ‘hope this email finds you well.’"},{id:"p7b",title:"Prompt 7B: The Podcast Pitch Engine (New)",tag:"Phase 3",body:"Draft a 150-word podcast pitch to [Host Name] of [Podcast Name]. My angle is [Insert contrarian take]. Include: Why their audience cares right now, 3 specific questions I can answer better than a generic guest, and one story I can tell that proves I have lived this. Tone: confident, specific, easy to say yes to."},{id:"p8",title:"Prompt 8: The Pre-Call Diagnostic Brief",tag:"Phase 4",body:"I have a discovery call tomorrow with [Name], [Title] at [Company]. Based on the company info and recent news pasted below [paste About page / recent news / job descriptions]: 1. Identify 3 likely internal growing pains their team is experiencing right now. 2. Give me 5 sharp, diagnostic questions I can ask on the call that demonstrate deep industry understanding and uncover the financial or operational cost of those pains. 3. List the top 2 objections they might raise about bringing in an external trainer, and how I should reframe each."},{id:"p9",title:"Prompt 9: The Cynical Buyer Proposal Audit",tag:"Phase 4",body:"Act as a skeptical, budget-conscious VP of People who receives ten training pitches a week. Review my draft proposal below: [Paste proposal]. Be ruthless: 1. Highlight every sentence that sounds vague, academic, or ‘fluffy.’ 2. Identify where the ROI or business impact feels weak. 3. List the top 3 reasons you would stall or ask for a 30% discount, and suggest specific edits to eliminate each risk signal."},{id:"p9b",title:"Prompt 9B: The Follow-Up That Does Not Beg (New)",tag:"Phase 4",body:"I sent this proposal 5 days ago and have not heard back: [Paste proposal summary]. Draft 3 follow-up messages: 1) A 2-sentence value-add nudge with a relevant article or insight, 2) A polite close-the-loop email that gives them an easy out, 3) A final breakup email that leaves the door open. Tone: calm, professional, zero desperation."},{id:"p10",title:"Prompt 10: The Rapid Statement of Work (SOW) Builder",tag:"Phase 5",body:"Turn these raw discovery call notes into a clean, formal 1-page Statement of Work (SOW): [Paste bullet points: client name, workshop title, format, dates, headcount, custom prep included, fee, and 50/50 payment schedule]. Organize it with clear headings: Project Objective, Scope of Deliverables, Client Responsibilities (e.g., room setup, participant roster), Timeline, and Investment & Terms. Keep the legal tone clean, plain-English, and profession
